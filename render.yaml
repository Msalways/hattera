services:
  - type: web
    name: hattera-preview
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: node /app/render/start.mjs
    healthCheckPath: /api/health
    envVars:
      - key: ENGINES
        value: opencode-ai
      - key: OMB_LOOPBACK_TRUST
        value: service
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_OWNER_ID
        sync: false
      - key: BETTER_AUTH_SECRET
        generateValue: true
