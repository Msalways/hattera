name: ${COMPOSE_PROJECT_NAME:-openmausbot}
services:
  omb:
    init: true
    build:
      context: .
      dockerfile: Dockerfile
      target: server
      args:
        ENGINES: ${ENGINES-@anthropic-ai/claude-code @openai/codex opencode-ai cline}
    image: ${HATTERA_LOCAL_IMAGE:-${OMB_LOCAL_IMAGE:-hattera-local:latest}}
    restart: unless-stopped
    volumes:
      - data:/data
    ports:
      - "${HATTERA_BIND_ADDRESS:-${OMB_BIND_ADDRESS:-127.0.0.1}}:${HATTERA_HTTP_PORT:-${OMB_HTTP_PORT:-8080}}:80"
      # Codex OAuth redirects to this fixed loopback port. Caddy forwards it
      # from the Docker host to the CLI's loopback listener in this namespace.
      - "127.0.0.1:1455:1455"
    environment:
      OMB_PORT: "8799"
      OMB_WEBHOOK_PORT: "8800"
      OMB_ENVIRONMENT_LABEL: ${HATTERA_ENVIRONMENT_LABEL:-${OMB_ENVIRONMENT_LABEL:-Hattera server}}
      OMB_PUBLIC_URL: ${HATTERA_PUBLIC_URL:-${OMB_PUBLIC_URL:-http://localhost:${HATTERA_HTTP_PORT:-${OMB_HTTP_PORT:-8080}}}}
      OMB_WEBHOOK_PUBLIC_URL: ${HATTERA_WEBHOOK_PUBLIC_URL:-${OMB_WEBHOOK_PUBLIC_URL:-${HATTERA_PUBLIC_URL:-${OMB_PUBLIC_URL:-http://localhost:${HATTERA_HTTP_PORT:-${OMB_HTTP_PORT:-8080}}}}}}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      GITHUB_OWNER_ID: ${GITHUB_OWNER_ID:-}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-}
      OMB_POSTGRES_ENABLED: ${HATTERA_POSTGRES_ENABLED:-${OMB_POSTGRES_ENABLED:-false}}
      DATABASE_URL: ${DATABASE_URL:-}
      OMB_POSTGRES_FILES_DIR: ${HATTERA_POSTGRES_FILES_DIR:-${OMB_POSTGRES_FILES_DIR:-/data/.openmausbot-postgres}}
      OMB_OBJECT_STORAGE_KIND: ${HATTERA_OBJECT_STORAGE_KIND:-${OMB_OBJECT_STORAGE_KIND:-local}}
      OMB_S3_BUCKET: ${HATTERA_S3_BUCKET:-${OMB_S3_BUCKET:-}}
      OMB_S3_REGION: ${HATTERA_S3_REGION:-${OMB_S3_REGION:-}}
      OMB_S3_ENDPOINT: ${HATTERA_S3_ENDPOINT:-${OMB_S3_ENDPOINT:-}}
      OMB_S3_PREFIX: ${HATTERA_S3_PREFIX:-${OMB_S3_PREFIX:-}}
      OMB_S3_FORCE_PATH_STYLE: ${HATTERA_S3_FORCE_PATH_STYLE:-${OMB_S3_FORCE_PATH_STYLE:-true}}
      OMB_S3_ACCESS_KEY_ID: ${HATTERA_S3_ACCESS_KEY_ID:-${OMB_S3_ACCESS_KEY_ID:-}}
      OMB_S3_SECRET_ACCESS_KEY: ${HATTERA_S3_SECRET_ACCESS_KEY:-${OMB_S3_SECRET_ACCESS_KEY:-}}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8799/api/health', { signal: AbortSignal.timeout(4000) }).then(async r => { if (!r.ok || !(await r.text()).includes('openmausbot')) process.exit(1); }).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
  caddy:
    image: ${CADDY_IMAGE:-caddy:2}
    restart: unless-stopped
    network_mode: service:omb
    environment:
      OMB_HTTPS_HOST: ${HATTERA_HTTPS_HOST:-${OMB_HTTPS_HOST:-}}
      OMB_BIND_ADDRESS: ${HATTERA_BIND_ADDRESS:-${OMB_BIND_ADDRESS:-127.0.0.1}}
    command:
      - /bin/sh
      - -ec
      - |
        export OMB_UPSTREAM_SCHEME=http
        export OMB_CODEX_CALLBACK_BIND="$$(hostname -i | awk '{print $$1}')"
        if [ -n "$$OMB_HTTPS_HOST" ] && [ "$$OMB_BIND_ADDRESS" != "127.0.0.1" ]; then
          echo "OMB_HTTPS_HOST requires OMB_BIND_ADDRESS=127.0.0.1; forward HTTPS through a trusted local proxy." >&2
          exit 1
        fi
        if [ -n "$$OMB_HTTPS_HOST" ]; then
          export OMB_UPSTREAM_SCHEME=https
        fi
        # Docker does not restart a network-namespace sidecar when its owner
        # restarts automatically. Exit if that namespace loses the app; the
        # restart policy then attaches Caddy to the current app namespace.
        (
          while sleep 10; do
            if ! wget -q -T 3 -O /dev/null http://127.0.0.1:8799/api/health; then
              echo "app unreachable; restarting Caddy to follow its network namespace" >&2
              kill -TERM 1
              exit
            fi
          done
        ) &
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    depends_on:
      omb:
        condition: service_healthy
        restart: true
    volumes:
      - ./deploy/local/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  data:
    external: ${HATTERA_DATA_EXTERNAL:-${OMB_DATA_EXTERNAL:-false}}
    name: ${HATTERA_DATA_VOLUME:-${OMB_DATA_VOLUME:-${COMPOSE_PROJECT_NAME:-openmausbot}_data}}
  caddy_data:
  caddy_config:
