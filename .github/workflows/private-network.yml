name: Hattera end-to-end acceptance

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - server/**
      - shared/**
      - src/**
      - scripts/**
      - public/**
      - pnpm-lock.yaml
      - vite.config.ts
      - tsconfig*.json
      - network/**
      - package.json
      - Dockerfile
      - .dockerignore
      - .github/workflows/private-network.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-component:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Build fresh artifacts and run required HTTP and browser journeys
        run: npm run test:e2e -- ${{ matrix.os == 'ubuntu-latest' && '--docker' || '' }}
      - name: Save E2E reports, logs and screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hattera-e2e-${{ matrix.os }}
          path: |
            output/e2e/
            output/playwright/
          if-no-files-found: warn
          retention-days: 7
