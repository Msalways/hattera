name: Publish npm package

on:
  # release.yml dispatches this on the tag it just published: a tag created
  # with the workflow token never fires push events on its own.
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to npm after all installation checks pass (unchecked: verify only)"
        type: boolean
        required: false
        default: false
  push:
    tags: [ "v*" ]
  pull_request:
    paths:
      - server/cli.ts
      - server/tunnel.ts
      - server/tailscale.ts
      - network/**
      - server/private-network.ts
      - scripts/prepare-network.mjs
      - server/pair-cli.ts
      - package.json
      - pnpm-lock.yaml
      - server/data/**
      - server/web-launcher.ts
      - scripts/testing/verify-npm-install.mjs
      - scripts/build-npm-package.mjs
      - scripts/bundle-server.mjs
      - .github/workflows/npm-package.yml

permissions:
  contents: read

jobs:
  pack-and-prove:
    name: assemble release tarball
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      dist_tag: ${{ steps.release.outputs.dist_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Validate npm publication request
        id: release
        env:
          MANUAL_PUBLISH: ${{ inputs.publish || false }}
          TAG_PUBLISH_ENABLED: ${{ vars.HATTERA_NPM_PUBLISH_ENABLED || 'false' }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const { GITHUB_EVENT_NAME: event, GITHUB_REF: ref, GITHUB_REPOSITORY: repo } = process.env;
          const releaseRef = `refs/tags/v${version}`;
          if (ref.startsWith('refs/tags/v') && ref !== releaseRef) throw new Error('The release tag must match package.json version.');
          const publish = event === 'workflow_dispatch'
            ? process.env.MANUAL_PUBLISH === 'true'
            : event === 'push' && ref === releaseRef && process.env.TAG_PUBLISH_ENABLED === 'true';
          if (publish && (repo !== 'Msalways/hattera' || !['refs/heads/main', releaseRef].includes(ref))) {
            throw new Error('Publish from Msalways/hattera main or the matching version tag.');
          }
          const tag = version.includes('-') ? 'next' : 'latest';
          appendFileSync(process.env.GITHUB_OUTPUT, `publish=${publish}\ndist_tag=${tag}\n`);
          console.log(publish ? `Will publish hattera@${version} as ${tag} after qualification.` : 'Verification only; npm publishing is disabled for this run.');
          NODE
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: pnpm build:network --all && pnpm build:server && pnpm exec vite build && node scripts/build-npm-package.mjs
      - name: Pack the release artifact
        run: cd release/npm && npm pack --silent
      - name: Save the tarball for installation qualification
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: release/npm/hattera-*.tgz
          if-no-files-found: error
          retention-days: 3

  install-and-prove:
    name: npm install on ${{ matrix.os }} (Node ${{ matrix.node }})
    needs: pack-and-prove
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-2025, windows-11-arm, macos-15, macos-15-intel]
        node: [24]
        include:
          - os: ubuntu-24.04
            node: 24.0.0
          - os: ubuntu-24.04
            node: 26
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: release/npm
      - name: Install and exercise the actual package outside the checkout
        shell: bash
        env:
          # Public downloads run on release tags and explicit qualification.
          # Account authorization is never performed by these jobs.
          HATTERA_VERIFY_NPM_BROWSER: ${{ matrix.os == 'ubuntu-24.04' && matrix.node == 24 && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')) && '1' || '0' }}
          HATTERA_VERIFY_NPM_PROVIDERS: ${{ matrix.os == 'ubuntu-24.04' && matrix.node == 24 && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')) && '1' || '0' }}
        run: |
          set -euo pipefail
          node scripts/testing/verify-npm-install.mjs release/npm/hattera-*.tgz output/npm-install/report.json
      - name: Record installation qualification
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-install-${{ matrix.os }}-node${{ matrix.node }}
          path: output/npm-install/report.json
          if-no-files-found: warn
      - name: Linux fleet agent shutdown
        if: matrix.os == 'ubuntu-24.04' && matrix.node == 24
        shell: bash
        run: |
          mkdir -p /tmp/hattera-fleet-package
          tar -xzf release/npm/hattera-*.tgz -C /tmp/hattera-fleet-package
          node scripts/testing/verify-fleet-shutdown.mjs /tmp/hattera-fleet-package/package/cli.js

  publish-npm:
    name: publish to npm
    needs: [pack-and-prove, install-and-prove]
    if: needs.pack-and-prove.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: npm-publish-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11 --userconfig /dev/null --registry https://registry.npmjs.org
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: release/npm
      # Prefer trusted publishing: npm trusts this workflow's OIDC identity.
      # A bootstrap NPM_TOKEN is optional for the initial publication.
      # One-time setup on
      # npmjs.com: package → Settings → Publishing access → GitHub Actions,
      # owner Msalways, repository hattera, workflow npm-package.yml.
      # OIDC needs npm >= 11.5.1; the step above installs current npm 11.
      - name: Publish to npm
        env:
          # Optional bootstrap credential for the first publication. Once npm
          # trusts this workflow, remove the token and use OIDC instead.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_DIST_TAG: ${{ needs.pack-and-prove.outputs.dist_tag }}
        run: |
          npm --version
          npm publish release/npm/hattera-*.tgz --access public --provenance --tag "$NPM_DIST_TAG"

  update-github-release:
    name: update GitHub release
    needs: publish-npm
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: release/npm
      - name: Note the npm package on the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The preceding npm publish must succeed. Registry reads can lag a
          # successful upload, so do not gate notes/artifacts on an immediate read.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$RUNNER_TEMP/notes.md"
            printf '\n\n**npm:** `npx hattera@%s` · https://www.npmjs.com/package/hattera/v/%s\n' "$version" "$version" >> "$RUNNER_TEMP/notes.md"
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/notes.md"
          fi
      # The same tarball beside the desktop installers on the GitHub release,
      # for people who install from a download rather than the registry. The
      # release exists by the time the tag does (publishing it is what creates
      # the tag); a tag pushed without one is left alone.
      - name: Attach the tarball to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/npm/hattera-*.tgz --repo "$GITHUB_REPOSITORY" --clobber
          else
            echo "no GitHub release named $GITHUB_REF_NAME; tarball not attached"
          fi
